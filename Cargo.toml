[package]
name = "spectral-pruner"
version = "2.0.0-rc.1"
edition = "2021"
authors = ["Stephan Arrington"]
description = "Zero-dependency weighted graph auditing with deterministic spectral partitioning and explainable diagnostics."
license = "MIT OR Apache-2.0"
repository = "https://github.com/steph4n-gh/spectral-pruner"
documentation = "https://docs.rs/spectral-pruner"
readme = "README.md"
keywords = ["spectral", "graph", "fiedler", "topology", "auditing"]
categories = ["algorithms", "science", "command-line-utilities"]
# Keep model tooling and experimental observations in the repository.
exclude = ["research/**"]

[dependencies]
# Absolute Zero Dependencies mandated.
