name: Rust CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Check Compiler Warnings (Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets --verbose

      - name: Build audit CLI
        run: cargo build --release --bin spectral-pruner-audit

      - name: Install research test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical oracle dependency
        run: python -m pip install numpy==2.2.6

      - name: Verify research harness and CLI contract
        run: |
          python -m py_compile research/*.py
          python -m unittest discover -s research -p 'test_*.py' -v

      - name: Verify numerical oracle and convergence reporting
        run: python research/numerical_oracle.py
